<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GMIT Efata SoE - Sistem Jadwal Pelayanan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      background-color: #555;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.50),
          rgba(0, 0, 0, 0.60)
        ),
        url("./assets/background-gereja.jpg");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Kartu utama */
    .card {
      position: relative;
      z-index: 2;

      width: 90%;
      max-width: 560px;

      padding: 40px 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.14);

      border: 1px solid rgba(255, 255, 255, 0.30);

      border-radius: 25px;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.40);
    }

    /* Logo */
    .logo {
      width: 130px;
      height: 130px;

      object-fit: contain;

      display: block;

      margin: 0 auto 20px;

      filter:
        drop-shadow(0 5px 10px rgba(0,0,0,0.45));
    }

    /* Nama gereja */
    .title {
      color: white;

      font-size: 32px;

      font-weight: bold;

      letter-spacing: 1.5px;

      text-shadow:
        0 3px 8px rgba(0,0,0,0.6);

      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255,255,255,0.90);

      font-size: 14px;

      letter-spacing: 2px;

      margin-bottom: 25px;
    }

    .line {
      width: 80px;
      height: 3px;

      margin: 0 auto 25px;

      background: white;

      border-radius: 10px;
    }

    /* Judul sistem */
    .system-title {
      color: white;

      font-size: 24px;

      line-height: 1.4;

      font-weight: bold;

      text-shadow:
        0 2px 7px rgba(0,0,0,0.6);

      margin-bottom: 15px;
    }

    .description {
      color: rgba(255,255,255,0.90);

      font-size: 14px;

      line-height: 1.7;

      margin-bottom: 28px;
    }

    /* Tombol */
    .button {
      display: inline-block;

      padding: 15px 32px;

      min-width: 240px;

      border-radius: 50px;

      background: white;

      color: #333;

      text-decoration: none;

      font-size: 16px;

      font-weight: bold;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.30);

      transition: all 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 13px 28px rgba(0,0,0,0.40);
    }

    .arrow {
      margin-left: 8px;
      font-size: 20px;
    }

    /* Footer */
    .footer {
      margin-top: 28px;

      padding-top: 18px;

      border-top:
        1px solid rgba(255,255,255,0.20);

      color:
        rgba(255,255,255,0.70);

      font-size: 11px;

      line-height: 1.6;
    }

    /* HP */
    @media (max-width: 600px) {

      .card {
        width: 92%;

        padding: 30px 20px;
      }

      .logo {
        width: 105px;
        height: 105px;
      }

      .title {
        font-size: 25px;
      }

      .subtitle {
        font-size: 11px;
      }

      .system-title {
        font-size: 20px;
      }

      .description {
        font-size: 13px;
      }

      .button {
        width: 100%;
      }
    }
  </style>

</head>

<body>

  <div class="card">

</div>

<!-- TOMBOL -->
<a

>
  MASUK KE SISTEM
  <span class="arrow">→</span>
</a>

<!-- FOOTER -->
<div class="footer">

  Sistem Pengaturan Jadwal Pelayanan Jemaat
</div>
```

</body>
