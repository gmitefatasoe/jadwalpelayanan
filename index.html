<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIMPEL EFATA | Jemaat GMIT Efata SoE</title>

  <meta name="description"
    content="SIMPEL EFATA - Sistem Manajemen Penjadwalan Pelayanan Jemaat GMIT Efata SoE">

  <style>
    :root{
      --blue:#075fc9;
      --blue2:#0a3f91;
      --blue3:#19a7e8;
      --gold:#f5b400;
      --gold2:#ffca28;
      --white:#fff;
      --navy:#092d68;
      --muted:#61738d;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{min-height:100%;width:100%}

    body{
      min-height:100vh;
      font-family:"Segoe UI",Arial,sans-serif;
      color:var(--navy);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;

      background:
        linear-gradient(135deg,rgba(3,35,86,.86),rgba(7,95,201,.48)),
        url("assets/background-gereja.jpg") center/cover no-repeat fixed;
    }

    .portal{
      width:min(1120px,100%);
      min-height:680px;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      overflow:hidden;
      border-radius:32px;
      background:rgba(255,255,255,.96);
      box-shadow:0 30px 90px rgba(0,20,60,.42);
      border:1px solid rgba(255,255,255,.7);
    }

    /* PANEL KIRI */
    .visual{
      position:relative;
      padding:44px 45px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;

      background:
        radial-gradient(circle at 15% 10%,rgba(25,167,232,.14),transparent 32%),
        linear-gradient(145deg,#eef7ff,#ffffff 72%);
    }

    .visual:before{
      content:"";
      position:absolute;
      width:520px;
      height:520px;
      border-radius:50%;
      border:42px solid rgba(7,95,201,.045);
      left:-270px;
      bottom:-260px;
    }

    .visual:after{
      content:"";
      position:absolute;
      width:380px;
      height:380px;
      border-radius:50%;
      border:28px solid rgba(245,180,0,.055);
      right:-220px;
      top:-210px;
    }

    .visual-content{
      position:relative;
      z-index:2;
      width:100%;
      max-width:470px;
    }

    /* LOGO GEREJA */
    .church-logo{
      width:78px;
      height:78px;
      object-fit:contain;
      margin:0 auto 12px;
      display:block;
    }

    .church-name{
      color:var(--blue2);
      font-size:12px;
      font-weight:800;
      letter-spacing:2px;
      margin-bottom:15px;
    }

    /* LOGO APLIKASI */
    .app-logo{
      width:min(100%,430px);
      max-height:445px;
      object-fit:contain;
      display:block;
      margin:0 auto;
      filter:drop-shadow(0 15px 22px rgba(5,55,125,.14));
    }

    .gold-line{
      width:125px;
      height:5px;
      border-radius:20px;
      margin:17px auto 0;
      background:linear-gradient(90deg,var(--blue),var(--gold));
    }

    /* PANEL KANAN */
    .access{
      position:relative;
      display:flex;
      align-items:center;
      padding:60px 55px;
      background:linear-gradient(155deg,#ffffff 0%,#f2f7fd 100%);
    }

    .access-content{
      width:100%;
      max-width:420px;
      margin:auto;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 13px;
      border-radius:30px;
      background:#eaf4ff;
      color:var(--blue);
      font-size:11px;
      font-weight:800;
      letter-spacing:1.3px;
      text-transform:uppercase;
      margin-bottom:20px;
    }

    .status-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#21a65a;
      box-shadow:0 0 8px rgba(33,166,90,.45);
    }

    h1{
      color:var(--blue2);
      font-size:clamp(30px,4vw,46px);
      line-height:1.05;
      letter-spacing:-1px;
      margin-bottom:16px;
      font-weight:850;
    }

    .lead{
      color:var(--muted);
      font-size:15px;
      line-height:1.8;
      margin-bottom:28px;
    }

    .highlight{
      color:var(--blue);
      font-weight:800;
    }

    .button{
      width:100%;
      min-height:60px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      border-radius:17px;
      text-decoration:none;
      color:white;
      background:linear-gradient(135deg,var(--blue2),var(--blue),var(--blue3));
      box-shadow:0 14px 30px rgba(7,95,201,.28);
      font-size:16px;
      font-weight:850;
      transition:.25s ease;
    }

    .button:hover{
      transform:translateY(-3px);
      box-shadow:0 19px 38px rgba(7,95,201,.38);
    }

    .arrow{
      font-size:23px;
      transition:.25s ease;
    }

    .button:hover .arrow{transform:translateX(5px)}

    .features{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      margin-top:25px;
    }

    .feature{
      padding:13px 8px;
      border-radius:13px;
      background:#edf5fd;
      color:#5c718b;
      text-align:center;
      font-size:10px;
      line-height:1.45;
    }

    .feature strong{
      display:block;
      color:var(--blue2);
      font-size:11px;
      margin-bottom:3px;
    }

    .footer{
      margin-top:30px;
      padding-top:18px;
      border-top:1px solid #dce7f2;
      color:#7b8ea4;
      font-size:11px;
      line-height:1.7;
    }

    .footer strong{color:#536b85}

    @media(max-width:820px){
      body{
        padding:12px;
        background-attachment:scroll;
      }

      .portal{
        grid-template-columns:1fr;
        min-height:auto;
        border-radius:25px;
      }

      .visual{
        padding:28px 22px 20px;
      }

      .church-logo{
        width:62px;
        height:62px;
      }

      .app-logo{
        width:min(90vw,380px);
        max-height:380px;
      }

      .access{
        padding:36px 25px 30px;
      }

      .access-content{
        max-width:520px;
      }
    }

    @media(max-width:440px){
      .portal{width:100%}

      .visual{padding:23px 15px 15px}

      .app-logo{
        width:92vw;
        max-height:330px;
      }

      .access{padding:30px 18px 25px}

      .features{grid-template-columns:1fr}

      .feature{padding:10px}

      h1{font-size:32px}
    }
  </style>
</head>

<body>

  <main class="portal">

    <!-- =====================================================
         PANEL BRAND
         ===================================================== -->
    <section class="visual">

      <div class="visual-content">

        <!-- LOGO GEREJA
             Simpan logo gereja di:
             assets/logo-gereja.png
        -->
        <img
          class="church-logo"
          src="assets/logo-gereja.png"
          alt="Logo GMIT Efata SoE"
        >

        <div class="church-name">
          JEMAAT GMIT EFATA SOE
        </div>

        <!-- LOGO APLIKASI
             Logo dari desain yang Anda kirim
        -->
        <img
          class="app-logo"
          src="assets/logo-aplikasi.png"
          alt="SIMPEL EFATA - Sistem Manajemen Penjadwalan Pelayanan"
        >

        <div class="gold-line"></div>

      </div>

    </section>


    <!-- =====================================================
         PANEL AKSES
         ===================================================== -->
    <section class="access">

      <div class="access-content">

        <div class="status">
          <span class="status-dot"></span>
          Portal Resmi
        </div>

        <h1>
          Selamat Datang
        </h1>

        <p class="lead">
          Akses
          <span class="highlight">SIMPEL EFATA</span>,
          Sistem Manajemen Penjadwalan Pelayanan
          Jemaat GMIT Efata SoE.
        </p>

        <a
          class="button"
          href="https://script.google.com/macros/s/AKfycbyPJY21t-CbnE11Y_E_p86N9q6VG9U1HHOC-uTj4Tb2dzC2n400zHDDUvJ6ZVVFgDNY/exec"
        >
          <span>MASUK KE SISTEM</span>
          <span class="arrow">→</span>
        </a>

        <div class="features">

          <div class="feature">
            <strong>Jadwal</strong>
            Pelayanan
          </div>

          <div class="feature">
            <strong>Manajemen</strong>
            Data
          </div>

          <div class="feature">
            <strong>Laporan</strong>
            Pelayanan
          </div>

        </div>

        <div class="footer">
          <strong>Jemaat GMIT Efata SoE</strong><br>
          Teratur dalam Pelayanan, Bersatu dalam Melayani.
        </div>

      </div>

    </section>

  </main>

</body>
</html>
